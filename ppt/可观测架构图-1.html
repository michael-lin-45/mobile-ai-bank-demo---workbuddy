<svg viewBox="0 0 680 690" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AI Agent 可观测最终目标架构</title>
  <desc>聚焦 AI 上层应用的数据底座与 AI 洞察层，包含采集、分信号存储、看板告警、洞察提炼三层</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Segoe UI",system-ui,sans-serif;fill:#2C2C2A}
    .th{font-size:13px;font-weight:500}
    .ts{font-size:11px;fill:#5F5E5A}
    .sec{font-size:13px;font-weight:500;fill:#0f172a}
  </style>

  <text x="340" y="28" text-anchor="middle" class="th">AI Agent 可观测最终目标架构</text>
  <text x="340" y="46" text-anchor="middle" class="ts">聚焦 Agent+LLM 的业务指标 / Trace / 会话，并向上提炼运营与运维洞察</text>

  <text x="40" y="72" class="sec">1. 可观测数据底座</text>

  <rect x="40" y="82" width="280" height="62" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="56" y="102" class="th">AI Agent Core (8080)</text>
  <text x="56" y="120" class="ts">OTel SDK: span / metric / log</text>
  <text x="56" y="136" class="ts">SessionBridge: 会话上报（独立管道）</text>

  <line x1="180" y1="144" x2="180" y2="158" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="40" y="160" width="280" height="56" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="56" y="180" class="th">OTel Collector (4318)</text>
  <text x="56" y="197" class="ts">batch · tail_sampling · attributes 富集</text>
  <text x="56" y="211" class="ts">（可选 Alloy 统一采集三信号）</text>

  <line x1="180" y1="216" x2="180" y2="230" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="40" y="232" width="150" height="64" rx="9" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="115" y="254" text-anchor="middle" class="th">Tempo / Jaeger</text>
  <text x="115" y="272" text-anchor="middle" class="ts">Trace 存储</text>
  <text x="115" y="288" text-anchor="middle" class="ts">(L0/L1/L2 链路)</text>

  <rect x="200" y="232" width="150" height="64" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="275" y="254" text-anchor="middle" class="th">Prometheus / VM</text>
  <text x="275" y="272" text-anchor="middle" class="ts">指标 (TTFT/TPOT/错误率)</text>
  <text x="275" y="288" text-anchor="middle" class="ts">Historgram 分位</text>

  <rect x="360" y="232" width="150" height="64" rx="9" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="435" y="254" text-anchor="middle" class="th">Loki + Vector</text>
  <text x="435" y="272" text-anchor="middle" class="ts">日志集中检索</text>
  <text x="435" y="288" text-anchor="middle" class="ts">(core.log / backend.log)</text>

  <rect x="520" y="232" width="120" height="64" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="580" y="254" text-anchor="middle" class="th">Langfuse</text>
  <text x="580" y="272" text-anchor="middle" class="ts">LLM 专项</text>
  <text x="580" y="288" text-anchor="middle" class="ts">token/成本/质量</text>

  <rect x="40" y="306" width="600" height="40" rx="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="56" y="330" class="th">自研 Sessions 服务 (9090) → PostgreSQL：会话回放 / 业务语义层（保留，标准栈无此能力）</text>

  <line x1="180" y1="296" x2="180" y2="356" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="40" y="358" width="280" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="56" y="378" class="th">Grafana 统一看板</text>
  <text x="56" y="395" class="ts">Trace / 指标 / 日志 / LLM 一张图</text>

  <rect x="360" y="358" width="280" height="48" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="376" y="378" class="th">Grafana Alerting 告警</text>
  <text x="376" y="395" class="ts">LLM 错误率 / TTFT P95 / health 非 UP 即告警</text>

  <text x="40" y="436" class="sec">2. AI 洞察层（从底座提炼运营 / 运维洞察）</text>

  <rect x="40" y="446" width="600" height="46" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="56" y="466" class="th">AI Insights 引擎（定时聚合 / 查询）</text>
  <text x="56" y="483" class="ts">数据源：Tempo + Prometheus + Loki + Langfuse + Sessions 库</text>

  <rect x="40" y="506" width="186" height="70" rx="9" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="56" y="528" class="th">性能瓶颈（运维）</text>
  <text x="56" y="546" class="ts">TTFT/TPOT P95、慢 trace</text>
  <text x="56" y="562" class="ts">慢函数火焰图、失败/重试率</text>

  <rect x="247" y="506" width="186" height="70" rx="9" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="263" y="528" class="th">准确率提升点（算法）</text>
  <text x="263" y="546" class="ts">意图误路由、FOLLOW 漏判</text>
  <text x="263" y="562" class="ts">低分回答、槽位填充错误</text>

  <rect x="454" y="506" width="186" height="70" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="470" y="528" class="th">业务转化瓶颈（运营）</text>
  <text x="470" y="546" class="ts">槽位完成率/放弃率</text>
  <text x="470" y="562" class="ts">转账转化率、多轮中断点</text>

  <rect x="40" y="592" width="600" height="44" rx="9" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="56" y="612" class="th">输出物：运营周报 · 运维告警 · 洞察看板 · 模型/提示词优化依据</text>
  <text x="56" y="628" class="ts">（TLS 全程加密：OTLP over gRPC+TLS、前端 HTTPS、DB 加密）</text>
</svg>
