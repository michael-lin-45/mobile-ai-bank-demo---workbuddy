spring:
  application:
    name: mobile-ai-demo    # 应用名称
  # 全局时区：北京时间。所有 Jackson 序列化到前端的 Instant/时间字段按东八区输出。
  # 与后端 9090 的 application.yml 保持一致，整个项目统一北京时区。
  jackson:
    time-zone: Asia/Shanghai

# ==================== 服务配置 ====================
server:
  error:
    include-exception: true
    include-message: always

# ==================== 监控配置 ====================
management:
  health:
    otlp:
      enabled: false
    redis:
      enabled: false
  otlp:
    metrics:
      export:
        url: http://127.0.0.1:4318/v1/metrics
        step: 60s
        timeout: 1s
        retry:
          max-attempts: 2
    # traces export handled by OTel javaagent
    logs:
      export:
        url: http://127.0.0.1:4318/v1/logs
  # tracing sampling handled by OTel javaagent
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: false
  observability:
    metrics:
      custom:
        enabled: true
        ai-intent-recognition: true
        ai-session-lifecycle: true
        ai-workflow-execution: true
        ai-business-outcome: true

# ==================== 模型配置 ====================
# 每个模型可独立配置 base-url / api-key / model, 支持环境变量覆盖
models:
  # L0 领域路由 - qwen2.5-7b-instruct 指令遵循更强
  domain:
    base-url: ${DOMAIN_BASE_URL:https://token.sensenova.cn}    # L0 领域路由模型API地址
    api-key: ${DOMAIN_API_KEY:sk-H7SWCDVdSXXSg12LGU5fzNKbdblyg5hz}                  # L0 领域路由模型API密钥
    model: ${DOMAIN_MODEL:sensenova-6.7-flash-lite}                                                 # L0 领域路由模型名称
  # L1 上下文路由 (FOLLOW/SWITCH/RESUME)
  context:
    base-url: ${CONTEXT_BASE_URL:https://token.sensenova.cn}    # L1 上下文路由模型API地址
    api-key: ${CONTEXT_API_KEY:sk-H7SWCDVdSXXSg12LGU5fzNKbdblyg5hz}                  # L1 上下文路由模型API密钥
    model: ${CONTEXT_MODEL:sensenova-6.7-flash-lite}                                                 # L1 上下文路由模型名称
  # L1 意图路由+改写 (理财L1)
  intent:
    base-url: ${INTENT_BASE_URL:https://token.sensenova.cn}     # L1 意图路由模型API地址
    api-key: ${INTENT_API_KEY:sk-H7SWCDVdSXXSg12LGU5fzNKbdblyg5hz}                   # L1 意图路由模型API密钥
    model: ${INTENT_MODEL:sensenova-6.7-flash-lite}                                                  # L1 意图路由模型名称
  # L2 子Graph提参
  param-extract:
    base-url: ${PARAM_EXTRACT_BASE_URL:https://token.sensenova.cn}  # L2 参数提取模型API地址
    api-key: ${PARAM_EXTRACT_API_KEY:sk-H7SWCDVdSXXSg12LGU5fzNKbdblyg5hz}                # L2 参数提取模型API密钥
    model: ${PARAM_EXTRACT_MODEL:sensenova-6.7-flash-lite}                                               # L2 参数提取模型名称
  # L1 闲聊 - 默认复用context配置(可改为32B+模型)
  chat:
    base-url: ${CHAT_BASE_URL:https://token.sensenova.cn}       # 闲聊模型API地址
    api-key: ${CHAT_API_KEY:sk-H7SWCDVdSXXSg12LGU5fzNKbdblyg5hz}                     # 闲聊模型API密钥
    model: ${CHAT_MODEL:sensenova-6.7-flash-lite}                                                   # 闲聊模型名称(可用更快的turbo)
  # L2 理财产品解读 - 流式输出，需要较好的模型生成高质量解读内容
  wealth-interpret:
    base-url: ${WEALTH_INTERPRET_BASE_URL:https://token.sensenova.cn}  # 理财解读模型API地址
    api-key: ${WEALTH_INTERPRET_API_KEY:sk-H7SWCDVdSXXSg12LGU5fzNKbdblyg5hz}                # 理财解读模型API密钥
    model: ${WEALTH_INTERPRET_MODEL:sensenova-6.7-flash-lite}                                               # 理财解读模型名称
  # Orchestration Planner模型 - 多意图规划需要较强的推理能力
  orch-planner:
    base-url: ${ORCH_PLANNER_BASE_URL:https://token.sensenova.cn}  # 编排规划模型API地址
    api-key: ${ORCH_PLANNER_API_KEY:sk-H7SWCDVdSXXSg12LGU5fzNKbdblyg5hz}                # 编排规划模型API密钥
    model: ${ORCH_PLANNER_MODEL:sensenova-6.7-flash-lite}                                               # 编排规划模型名称
  # Orchestration Agent模型 - 域Agent和SummaryAgent使用
  orch:
    base-url: ${ORCH_BASE_URL:https://token.sensenova.cn}  # 编排Agent模型API地址
    api-key: ${ORCH_API_KEY:sk-H7SWCDVdSXXSg12LGU5fzNKbdblyg5hz}                # 编排Agent模型API密钥
    model: ${ORCH_MODEL:sensenova-6.7-flash-lite}                                               # 编排Agent模型名称

# ==================== 路由配置 ====================
# 绑定到 SubGraphProperties, 新增领域只需改yml不动Java
routing:
  # 确定性路由 - 关键词匹配, 不调LLM
  deterministic:
    cancel-keywords: ["算了", "不转了", "取消", "不要了", "放弃"]                          # 取消意图关键词列表
    short-answer-pattern: "^\\d+(\\.\\d+)?(元|块|万)?$|^(确认|好的|是的|对|继续|可以)$"     # 短答复正则(直接当作参数,不再路由)
  # 置信度阈值
  confidence:
    disambiguation-threshold: 0.7    # 消歧触发阈值 — confidence低于此值且意图属于歧义组时,补充触发消歧
    high-confidence-bypass: 0.85     # 高置信度豁免 — confidence高于此值时,即使LLM标ambiguous也信任首选意图
  # 对话历史条数配置
  history:
    l0-max-pairs: 10    # L0 域路由使用的历史对数
    l1-max-pairs: 10    # L1 意图路由使用的历史对数
    chat-max-pairs: 10  # ChatService 闲聊使用的历史对数
    max-stored-pairs: 20  # OverAllState.messages 最大存储对话对数(超出时淘汰最早的对,0=不限制)
  # 参数校验重试
  verification:
    max-retries: 1      # L2 提参校验最大重试次数

  # 意图注册表 — 新增意图只需在此添加,无需改Java代码
  # 每个意图对应一个L2子Graph, 由SubGraphRegistry在启动时读取
  intents:
    # ★ domain + graph-bean 同时服务 L0/L1/Orchestration 三层 ★（domain/graph-bean 合并自主分支A）
    - name: TRANSFER             # 意图名(大写, 与GraphConfig中bindGraph()的名称一致)
      domain: TRANSFER           # ← 所属领域 — Orchestration自动推导 domainAgent 的默认工具
      graph-bean: transferGraph  # ← L2 CompiledGraph Bean — Orchestration自动绑定 L2GraphTool
      description: "转账给他人"   # 意图描述(LLM可见,用于意图识别)
      param-schema: "收款人名称, 转账金额, 用途(可选)"   # 参数schema(LLM可见,用于提参)
      is-write-op: true          # 是否为写操作(写操作需确认)
      intent-type: OPERATION     # 意图类型: OPERATION(操作) / QUERY(查询) / CONSULTATION(咨询)
      scope: "资金转账操作，将钱转给他人或理财产品等"      # 处理范围描述(供SubGraphRouter判断belongs_to_domain)
    - name: BILL_QUERY
      domain: BILL
      graph-bean: billQueryGraph
      description: "查询账单明细"
      param-schema: "时间范围, 支出/收入类型(可选)"
      is-write-op: false
      intent-type: QUERY
      scope: "账单/消费/收支明细查询"
    - name: WEALTH_CONSULT
      domain: WEALTH
      graph-bean: wealthConsultGraph
      description: "理财咨询/推荐"
      param-schema: "风险偏好(激进/稳健/保守), 关注领域(科技/能源/汽车/银行/工业/饮食/娱乐/全部, 可选, 默认全部)"
      is-write-op: false
      intent-type: CONSULTATION
      scope: "理财咨询与推荐，基于风险偏好推荐理财产品"
    - name: WEALTH_INTERPRET
      domain: WEALTH
      graph-bean: wealthInterpretGraph
      description: "理财产品解读"
      param-schema: "理财产品名称"
      is-write-op: false
      intent-type: CONSULTATION
      scope: "理财产品/标的解读，分析具体理财产品的详情"
    - name: WEALTH_PURCHASE      # ← 合并自主分支A：理财产品购买
      domain: WEALTH
      graph-bean: wealthPurchaseGraph
      description: "购买理财产品"
      param-schema: "理财产品名称, 购买份额数"
      is-write-op: true
      intent-type: OPERATION
      scope: "理财产品购买操作，买入指定理财产品的指定份额"

  # 意图消歧组 — 多个意图共享关键词时需要消歧追问
  # 当LLM无法区分具体意图时, 系统向用户追问以明确意图
  intent-groups:
    - group-id: WEALTH                          # 组ID(大写, L1可能返回此组名而非具体意图)
      display-name: "理财"                       # 组显示名(消歧追问时使用)
      intent-names: [WEALTH_CONSULT, WEALTH_INTERPRET, WEALTH_PURCHASE]   # 组内意图列表（合并自A: 新增WEALTH_PURCHASE）
      disambiguation-question: "请问您需要理财咨询还是理财产品解读？"  # 消歧追问话术

  # 领域关键词 — DomainRouter确定性路由使用
  # 新增领域只需在此添加关键词, 无需改Java代码
  domains:
    TRANSFER:
      keywords: ["转账", "转钱", "汇款", "打款", "付款", "转给", "打给", "赚钱给", "打钱给", "转", "汇给"]   # 转账领域关键词
    BILL:
      keywords: ["账单", "明细", "消费", "支出", "收入", "收支", "开销", "流水", "开支"]                     # 账单领域关键词
    WEALTH:
      keywords: ["理财", "投资", "收益", "基金", "推荐", "咨询", "解读", "股票", "购买", "买入", "买理财"]                             # 理财领域关键词（合并自A: 新增购买/买入/买理财）
    UNSUPPORTED:
      keywords: ["贷款", "信用卡", "活动", "积分", "开户", "挂失", "存款", "保险"]                           # 不支持的领域关键词(触发UNSUPPORTED回复)

# ==================== 会话配置 ====================
session:
  # 挂起Agent管理(SuspendedAgents)
  pending-agents:
    max-depth: 5                 # 单个域最大同时挂起Agent数
    expire-minutes: 5            # 挂起Agent过期时间(分钟)
    prompt-max-times: 2          # 参数追问最大次数
    prompt-timeout-seconds: 30   # 参数追问超时时间(秒)
  # 最近活跃Agent追踪(LastAgent)
  last-agent:
    expire-minutes: 5            # 最近活跃Agent过期时间(分钟)
  # 最近活跃领域追踪(LastDomain)
  last-domain:
    expire-minutes: 5            # 最近活跃领域过期时间(分钟, 用于L0路由兜底)

# ==================== 工具超时配置 ====================
tool-timeout:
  read-seconds: 30    # 只读工具超时(秒)
  write-seconds: 60   # 写操作工具超时(秒)

# ==================== 状态存储配置 ====================
# 改 type 后重启即可切换 in-memory / redis, 两套存储自动生效
storage:
  type: in-memory    # 存储类型: in-memory(开发/测试) | redis(生产)
  redis:
    host: localhost   # Redis主机地址
    port: 6379        # Redis端口
    # password:        # Redis密码(生产环境务必设置)
    database: 0       # Redis数据库编号(0-15)

# ==================== Memory配置 ====================
memory:
  store:
    type: in-memory    # 长期记忆存储类型: in-memory(开发/测试) | redis(生产) — 与 storage.type 独立配置
  conversation:
    recent-days: 30   # 对话历史保留天数
  domain:
    top-k: 5          # 域状态Top-K保留数量

# ==================== 日志配置 ====================
logging:
  level:
    com.mobileagent: DEBUG    # 项目日志级别: DEBUG / INFO / WARN / ERROR

# ==================== 编排Agent配置 ====================
# 新增域只需修改此段yml，无需改Java代码（合并自主分支A）
orchestration:
  # ★ routing.intents 是唯一真相源 ★
  # agents 只需声明 domain → 本域工具从 routing.intents 自动推导
  # tools 段仅用于跨域或额外工具
  agents:
    - name: transfer_agent
      domain: TRANSFER          # ← 自动推导: routing.intents 中 domain=TRANSFER → transferGraph → 1个L2GraphTool
      instruction: |
        你是转账领域专家。根据用户输入，选择合适的工具执行转账相关操作。
        可用工具：transfer（转账操作）。
        当用户确认转账时，使用transfer工具。
        注意：工具调用会返回"工具调用中"的占位字符串，这是正常的，不需要重复调用。
        【L1上下文合并规则】当用户输入中包含"L1上下文"时，你必须将其中的信息（如收款人、金额等）与当前任务合并改写后再调用工具。例如：当前任务"转9000元" + L1上下文用户输入"给我妈转账一笔家用费用" → 合并为"转给我妈9000元"再调用transfer工具。
      output-key: transfer_result

    - name: bill_agent
      domain: BILL              # ← 自动推导: routing.intents 中 domain=BILL → billQueryGraph → 1个L2GraphTool
      instruction: |
        你是账单查询专家。根据用户输入，使用工具查询账单信息。
        可用工具：bill_query（查询账单）。
        注意：工具调用会返回"工具调用中"的占位字符串，这是正常的，不需要重复调用。
        【L1上下文合并规则】当用户输入中包含"L1上下文"时，你必须其中的信息与当前任务合并改写后再调用工具。
      output-key: bill_result

    - name: wealth_agent
      domain: WEALTH            # ← 自动推导: routing.intents 中 domain=WEALTH → wealthConsultGraph+wealthInterpretGraph+wealthPurchaseGraph → 3个L2GraphTool
      instruction: |
        你是理财领域专家。根据用户输入，选择合适的工具执行理财相关操作。
        可用工具：wealth_consult（理财咨询推荐）、wealth_interpret（理财产品解读）、wealth_purchase（购买理财产品）。
        注意：工具调用会返回"工具调用中"的占位字符串，这是正常的，不需要重复调用。
        【L1上下文合并规则】当用户输入中包含"L1上下文"时，你必须将其中的信息与当前任务合并改写后，再选择合适的工具调用。
      # 如需跨域工具（如查询余额辅助理财决策），在此添加:
      # tools:
      #   - name: bill_query
      #     graph-bean: billQueryGraph
      #     description: 查询余额（跨域辅助工具）
      output-key: wealth_result

  # ★ 不再需要 routing 段 — domain→agent 映射从 agents[].domain + agents[].name 自动推导 ★

  global:
    recursion-limit: 50
    timeout-seconds: 300
    orch-max-messages: 6

# ==================== 转账HTTP API配置 ====================
# 转账L2子图改造为HTTP代理模式，通过此配置指定后端API地址和请求参数（合并自主分支A）
transfer:
  api:
    url: ${TRANSFER_API_URL:http://localhost:8080/api/transfer}
    params:
      environment: "111-小红_积分转账通用账户.json"
      node_check: "NO"

# ==================== RAG 可观测埋点层（诊断/参考实现，默认关闭，仅 dev 暴露） ====================
# 本期仅交付内存参考实现（MinimalReferenceRetriever / MinimalReferenceReRanker）。
# 诊断端点 /api/v1/rag/retrieve 经 @Profile("dev") + 本开关双重守卫，生产不暴露。
# 启用示例（dev 环境 E2E 验证）：--spring.profiles.active=dev -Dobservability.rag.reference.enabled=true
observability:
  rag:
    reference:
      enabled: false
