spring:
  application:
    name: mobile-ai-demo

models:
  context:
    base-url: ${CONTEXT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${CONTEXT_API_KEY:sk-b545467bbc0f4270a842519ca69d9860}
    model: ${CONTEXT_MODEL:qwen-turbo}
  intent:
    base-url: ${INTENT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${INTENT_API_KEY:sk-b545467bbc0f4270a842519ca69d9860}
    model: ${INTENT_MODEL:qwen-turbo}
  param-extract:
    base-url: ${PARAM_EXTRACT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${PARAM_EXTRACT_API_KEY:sk-b545467bbc0f4270a842519ca69d9860}
    model: ${PARAM_EXTRACT_MODEL:qwen-plus}

routing:
  deterministic:
    cancel-keywords: ["算了", "不转了", "取消", "不要了", "放弃"]
    short-answer-pattern: "^\\d+(\\.\\d+)?(元|块|万)?$|^(确认|好的|是的|对|继续|可以)$"
  confidence:
    # 消歧置信度阈值 - confidence低于此值且意图属于歧义组时,补充触发消歧
    disambiguation-threshold: 0.7
    # 高置信度豁免 - confidence高于此值时,即使LLM标ambiguous也信任首选意图
    high-confidence-bypass: 0.85
  history:
    # 对话历史对数(1对=1条用户+1条系统),默认4对=8条消息,注入IntentRouter用于上下文判断
    max-pairs: 4
  verification:
    max-retries: 1

intents:
  - name: TRANSFER
    description: "转账给他人"
    param-schema: "收款人名称, 转账金额, 用途(可选)"
    is-write-op: true
  - name: BILL_QUERY
    description: "查询账单明细"
    param-schema: "时间范围, 支出/收入类型(可选)"
    is-write-op: false
  - name: WEALTH_CONSULT
    description: "理财咨询/推荐"
    param-schema: "风险偏好(激进/稳健/保守)"
    is-write-op: false
  - name: WEALTH_INTERPRET
    description: "理财产品解读"
    param-schema: "理财产品名称"
    is-write-op: false

session:
  pending-agents:
    max-depth: 3
    expire-minutes: 30
    prompt-max-times: 2
    prompt-timeout-seconds: 30
  last-agent:
    expire-minutes: 5

tool-timeout:
  read-seconds: 30
  write-seconds: 60

memory:
  conversation:
    recent-days: 30
  domain:
    top-k: 5

logging:
  level:
    com.mobileagent: DEBUG
