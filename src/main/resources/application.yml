spring:
  application:
    name: mobile-ai-demo

models:
  # L0 领域路由 - qwen2.5-7b-instruct 指令遵循更强
  domain:
    base-url: ${DOMAIN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${DOMAIN_API_KEY:sk-b545467bbc0f4270a842519ca69d9860}
    model: ${DOMAIN_MODEL:qwen-plus}
  # L1 上下文路由 (FOLLOW/SWITCH/RESUME)
  context:
    base-url: ${CONTEXT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${CONTEXT_API_KEY:sk-b545467bbc0f4270a842519ca69d9860}
    model: ${CONTEXT_MODEL:qwen-plus}
  # L1 意图识别+改写 (理财L1)
  intent:
    base-url: ${INTENT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${INTENT_API_KEY:sk-b545467bbc0f4270a842519ca69d9860}
    model: ${INTENT_MODEL:qwen-plus}
  # L2 子Graph提参
  param-extract:
    base-url: ${PARAM_EXTRACT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${PARAM_EXTRACT_API_KEY:sk-b545467bbc0f4270a842519ca69d9860}
    model: ${PARAM_EXTRACT_MODEL:qwen-plus}
  # L1 闲聊 - 默认复用context配置(可改为32B+模型)
  chat:
    base-url: ${CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${CHAT_API_KEY:sk-b545467bbc0f4270a842519ca69d9860}
    model: ${CHAT_MODEL:qwen-turbo}
  # L2 理财产品解读 - 流式输出，需要较好的模型生成高质量解读内容
  wealth-interpret:
    base-url: ${WEALTH_INTERPRET_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${WEALTH_INTERPRET_API_KEY:sk-b545467bbc0f4270a842519ca69d9860}
    model: ${WEALTH_INTERPRET_MODEL:qwen-plus}

routing:
  deterministic:
    cancel-keywords: ["算了", "不转了", "取消", "不要了", "放弃"]
    short-answer-pattern: "^\\d+(\\.\\d+)?(元|块|万)?$|^(确认|好的|是的|对|继续|可以)$"
  confidence:
    # 消歧置信度阈值 - confidence低于此值且意图属于歧义组时,补充触发消歧
    disambiguation-threshold: 0.7
    # 高置信度豁免 - confidence高于此值时,即使LLM标ambiguous也信任首选意图
    high-confidence-bypass: 0.85
  history:
    # 对话历史存储对数(1对=1条用户+1条助手),默认10对=20条消息,ChatMemory存储上限
    max-pairs: 10
    # L1领域内意图判断和改写节点使用的历史对数,默认6对=12条消息
    judgment-max-pairs: 6
    # L0传给L1的全局跨域历史对数,默认10对=20条消息,用于跨域指代消解
    global-context-max-pairs: 10
  verification:
    max-retries: 1

  # 意图注册表 - 新增意图只需在此添加,无需改Java代码
  intents:
    - name: TRANSFER
      description: "转账给他人"
      param-schema: "收款人名称, 转账金额, 用途(可选)"
      is-write-op: true
      intent-type: OPERATION
      scope: "资金转账操作，将钱转给他人或理财产品等"
    - name: BILL_QUERY
      description: "查询账单明细"
      param-schema: "时间范围, 支出/收入类型(可选)"
      is-write-op: false
      intent-type: QUERY
      scope: "账单/消费/收支明细查询"
    - name: WEALTH_CONSULT
      description: "理财咨询/推荐"
      param-schema: "风险偏好(激进/稳健/保守), 关注领域(科技/能源/汽车/银行/工业/饮食/娱乐/全部, 可选, 默认全部)"
      is-write-op: false
      intent-type: CONSULTATION
      scope: "理财咨询与推荐，基于风险偏好推荐理财产品"
    - name: WEALTH_INTERPRET
      description: "理财产品解读"
      param-schema: "理财产品名称"
      is-write-op: false
      intent-type: CONSULTATION
      scope: "理财产品/标的解读，分析具体理财产品的详情"

  # 意图消歧组 - 多个意图共享关键词时需要消歧追问
  intent-groups:
    - group-id: WEALTH
      display-name: "理财"
      intent-names: [WEALTH_CONSULT, WEALTH_INTERPRET]
      disambiguation-question: "请问您需要理财咨询还是理财产品解读？"

  # 领域关键词 - DomainRouter确定性路由使用,新增领域只需在此添加关键词
  domains:
    TRANSFER:
      keywords: ["转账", "转钱", "汇款", "打款", "付款", "转给", "打给", "赚钱给", "打钱给", "转", "汇给"]
    BILL:
      keywords: ["账单", "明细", "消费", "支出", "收入", "收支", "开销", "流水", "开支"]
    WEALTH:
      keywords: ["理财", "投资", "收益", "基金", "推荐", "咨询", "解读", "股票"]
    UNSUPPORTED:
      keywords: ["贷款", "信用卡", "活动", "积分", "开户", "挂失", "存款", "保险"]

session:
  pending-agents:
    max-depth: 5
    expire-minutes: 5
    prompt-max-times: 2
    prompt-timeout-seconds: 30
  last-agent:
    expire-minutes: 5
  last-domain:
    expire-minutes: 5

tool-timeout:
  read-seconds: 30
  write-seconds: 60

# 状态存储配置 — 改 type 后重启即可切换 in-memory / redis
storage:
  type: in-memory    # in-memory | redis
  redis:
    host: localhost
    port: 6379
    # password:
    database: 0

memory:
  conversation:
    recent-days: 30
  domain:
    top-k: 5

logging:
  level:
    com.mobileagent: DEBUG
