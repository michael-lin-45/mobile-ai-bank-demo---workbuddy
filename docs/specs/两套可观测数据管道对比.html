<svg viewBox="0 0 680 500" width="100%" role="img">
  <title>会话回放与会话追踪是两套独立数据管道</title>
  <desc>左侧 sessions 管道由 Core 异步桥接写入，按 sessionId 关联；右侧 spans 管道由 OTel 导出写入，按 traceId 关联。两者仅通过 session_turns.traceId 弱关联。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="170" y="42" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">会话回放管道 · sessions</text>
  <text x="510" y="42" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">链路追踪管道 · spans</text>

  <!-- LEFT column (blue) -->
  <g>
    <rect x="50" y="70" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="170" y="88" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Core · /api/bank/chat</text>
    <text x="170" y="106" text-anchor="middle" font-size="12" fill="#444441">BankController 处理请求</text>
  </g>
  <line x1="170" y1="122" x2="170" y2="148" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="50" y="150" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="170" y="168" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">SessionBridge.reportSession</text>
    <text x="170" y="186" text-anchor="middle" font-size="12" fill="#444441">@Async · HTTP POST · 失败不影响主业务</text>
  </g>
  <line x1="170" y1="202" x2="170" y2="228" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="50" y="230" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="170" y="248" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Backend · POST /api/v1/sessions</text>
    <text x="170" y="266" text-anchor="middle" font-size="12" fill="#444441">SessionService.upsertSession</text>
  </g>
  <line x1="170" y1="282" x2="170" y2="308" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="50" y="310" width="240" height="52" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="170" y="328" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">H2 · sessions + session_turns</text>
    <text x="170" y="346" text-anchor="middle" font-size="12" fill="#444441">关联键：sessionId（同会话多轮共享）</text>
  </g>
  <line x1="170" y1="362" x2="170" y2="388" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="50" y="390" width="240" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="170" y="408" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">前端「会话回放」页</text>
    <text x="170" y="426" text-anchor="middle" font-size="12" fill="#444441">GET /api/v1/sessions</text>
  </g>

  <!-- RIGHT column (purple) -->
  <g>
    <rect x="390" y="70" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="510" y="88" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">Core OTel javaagent 拦截</text>
    <text x="510" y="106" text-anchor="middle" font-size="12" fill="#444441">每个 LLM / HTTP 调用自动埋点</text>
  </g>
  <line x1="510" y1="122" x2="510" y2="148" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="390" y="150" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="510" y="168" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">OTLP → Collector :4318</text>
    <text x="510" y="186" text-anchor="middle" font-size="12" fill="#444441">标准导出协议，链路更长</text>
  </g>
  <line x1="510" y1="202" x2="510" y2="228" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="390" y="230" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="510" y="248" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">Backend · OtlpParserService</text>
    <text x="510" y="266" text-anchor="middle" font-size="12" fill="#444441">解析 span 入库</text>
  </g>
  <line x1="510" y1="282" x2="510" y2="308" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="390" y="310" width="240" height="52" rx="8" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
    <text x="510" y="328" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">H2 · spans</text>
    <text x="510" y="346" text-anchor="middle" font-size="12" fill="#444441">关联键：traceId（一次请求一个 trace）</text>
  </g>
  <line x1="510" y1="362" x2="510" y2="388" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="390" y="390" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="510" y="408" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">前端「链路追踪」页</text>
    <text x="510" y="426" text-anchor="middle" font-size="12" fill="#444441">GET /api/v1/traces</text>
  </g>

  <!-- weak association -->
  <line x1="290" y1="336" x2="390" y2="336" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="340" y="328" text-anchor="middle" font-size="11" fill="#5F5E5A">session_turns.traceId</text>

  <text x="340" y="470" text-anchor="middle" font-size="12" fill="#5F5E5A">弱关联：session_turns 存当轮 traceId，可从会话回放跳转到 trace（单向引用，非依赖）</text>
</svg>
